name: Sync Upstream Master

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  workflow_dispatch:      # Allows manual trigger via GitHub Actions UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and merge upstream/master
        run: |
          git remote add upstream https://github.com/CadQuery/cadquery.git
          git fetch upstream master
          git checkout master
          git merge --ff-only upstream/master
          git push origin master
